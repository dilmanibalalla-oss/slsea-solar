name: Solar API checks

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  syntax:
    name: Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run lint

  integration:
    name: Tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/solar_api
      JWT_SECRET: ci-test-secret-must-be-at-least-32-bytes-long
      JWT_ISSUER: solar-api
      JWT_AUDIENCE: solar-clients
      PUBLIC_API_URL: https://slsea-solar.vercel.app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
